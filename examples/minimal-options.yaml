show_legend: true
show_summary: true
show_status: true               # Datenstand und Fehlerhinweise
show_date: true
expandable: true                # Antippen klappt Details auf
weekend_shows_next_week: true
show_weekend_lessons: true      # Sa/So nur, wenn Stunden vorhanden sind
