# Alle Optionen mit ihren Standardwerten
type: custom:smo-schedule-card
entity: sensor.schule_max_mustermann_stundenplan_heute   # oder: student_id: "1234567"
title: Stundenplan Max          # optional, Standard: "Stundenplan · <Name>"
default_view: week              # compact | day | week
views: [compact, day, week]
language: auto                  # auto | de | en
show_teacher: true
show_room: true
show_times: true
